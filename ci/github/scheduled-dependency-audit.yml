# A weekly dependency audit that opens one issue rather than sending mail.
#
# An issue is the right output: it is assignable, closeable, and visible to
# everyone. A scheduled job that emails one person is a scheduled job whose
# findings die when that person is on leave.

name: dependency audit

on:
  schedule:
    - cron: '0 7 * * MON'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        id: py
        continue-on-error: true
        run: |
          pip install --disable-pip-version-check pip-audit
          pip-audit --strict --format markdown > py-audit.md || echo "found=1" >> "$GITHUB_OUTPUT"
          cat py-audit.md

      - uses: actions/setup-node@v4
        if: hashFiles('**/package-lock.json', '**/bun.lock') != ''
        with:
          node-version: '22'
      - name: Audit Node dependencies
        if: hashFiles('**/package-lock.json') != ''
        id: node
        continue-on-error: true
        run: |
          npm audit --audit-level=high > node-audit.txt || echo "found=1" >> "$GITHUB_OUTPUT"
          cat node-audit.txt

      - name: Open or update one issue
        if: steps.py.outputs.found == '1' || steps.node.outputs.found == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = p => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            const body = [
              'The weekly dependency audit found advisories.',
              '',
              read('py-audit.md'),
              '',
              '```',
              read('node-audit.txt').slice(0, 8000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const title = 'Dependency advisories';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dependencies'
            });
            const open = existing.data.find(i => i.title === title);
            if (open) {
              // Update the standing issue rather than opening a fifth one.
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['dependencies', 'security']
              });
            }
