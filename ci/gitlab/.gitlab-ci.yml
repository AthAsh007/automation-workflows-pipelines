# The same gates as ci/github/, for GitLab CI.
#
# Included from another project:
#
#   include:
#     - project: 'you/automation-workflows-pipelines'
#       file: '/ci/gitlab/.gitlab-ci.yml'

stages: [lint, test, audit, release]

default:
  image: python:3.12-slim
  # Retry only the failures that are worth retrying. Retrying a failing test
  # wastes minutes and hides a flake behind a green pipeline.
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure]

variables:
  PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  MIN_COVERAGE: '80'

cache:
  # Keyed on the lockfile, not the branch.
  key:
    files: [requirements.txt, requirements-dev.txt]
  paths: ['.cache/pip']

workflow:
  rules:
    # Do not run twice for a branch that already has an open merge request.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  script:
    - pip install --disable-pip-version-check ruff
    - ruff check --output-format=gitlab . > code-quality.json || true
    - ruff check .
    - ruff format --check --diff .
  artifacts:
    reports:
      codequality: code-quality.json

test:
  stage: test
  parallel:
    matrix:
      - PY_VERSION: ['3.11', '3.12', '3.13']
  image: python:$PY_VERSION-slim
  script:
    - pip install --disable-pip-version-check -r requirements.txt pytest pytest-cov
    - pytest -q --cov --cov-report=term --cov-report=xml --junitxml=report.xml
    - |
      python - <<'PY'
      import os, sys, xml.etree.ElementTree as ET
      floor = float(os.environ.get("MIN_COVERAGE", "0"))
      rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
      print("line coverage %.1f%%, floor %.1f%%" % (rate, floor))
      sys.exit(0 if rate >= floor else 1)
      PY
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

audit:
  stage: audit
  script:
    - pip install --disable-pip-version-check pip-audit
    - pip-audit --strict
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "releasing $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
